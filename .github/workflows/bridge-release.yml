name: Bridge Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "bridge-v*"

permissions:
  contents: write

jobs:
  build:
    # node-printer ainda depende do toolchain MSVC 2022; o runner "latest"
    # já aponta para o Visual Studio 2026, que o node-gyp usado pelo módulo não reconhece.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: npm ci

      - name: Build Bridge Installer
        run: npm run dist:bridge

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: popconnect-windows
          path: |
            dist-bridge/**/*.exe
            dist-bridge/**/*.yml
            dist-bridge/**/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            release-artifacts/**/*
          generate_release_notes: true
