name: Pop Connect Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "bridge-v*"
      - "pop-connect-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Pop Connect Installer
        run: npm run dist:pop-connect

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pop-connect-${{ matrix.os }}
          path: |
            dist-bridge/**/*.exe
            dist-bridge/**/*.dmg
            dist-bridge/**/*.AppImage
            dist-bridge/**/*.zip
            dist-bridge/**/*.yml
            dist-bridge/**/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v') || startsWith(github.ref, 'refs/tags/pop-connect-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
          generate_release_notes: true
