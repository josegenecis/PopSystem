name: vercel-deploy

on:
  workflow_dispatch:
    inputs:
      homologation_approved:
        description: "Confirma que a versao foi testada e homologada?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  deploy:
    if: inputs.homologation_approved == 'yes'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        id: vercel-secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel CLI deploy because repository secrets are missing. Git integration can still publish production."
          fi
      - uses: actions/setup-node@v4
        if: steps.vercel-secrets.outputs.can_deploy == 'true'
        with:
          node-version: '20.x'
          cache: 'npm'
      - uses: denoland/setup-deno@v2
        if: steps.vercel-secrets.outputs.can_deploy == 'true'
        with:
          deno-version: v2.x
      - if: steps.vercel-secrets.outputs.can_deploy == 'true'
        run: npm ci
      - if: steps.vercel-secrets.outputs.can_deploy == 'true'
        run: npm run build
      - if: steps.vercel-secrets.outputs.can_deploy == 'true'
        run: npm run test:fiscal
      - name: Deploy to Vercel (Production)
        if: steps.vercel-secrets.outputs.can_deploy == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: "--prod"
